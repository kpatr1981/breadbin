# Breadbin kernel: loads at $0801 (BASIC SYS stub), copies itself up and runs
# from KRAM; the syscall jump table lives at a fixed $CF00.
MEMORY {
    ZP:   start = $40,   size = $50,   type = rw, define = yes;
    LA:   start = $07FF, size = 2,     file = %O;
    LOAD: start = $0801, size = $8000, file = %O;
    KRAM: start = $8500, size = $4A00, define = yes;
    JT:   start = $CF00, size = $100;
    # RAM under the KERNAL ROM, after the process tables (P_SAVE ... in k.inc)
    HI:   start = $EC00, size = $1300, define = yes;
    # RAM the KERNAL leaves alone (tty.s): the cassette buffer, and $02A7-$02FF
    LOWA: start = $0334, size = $CC,   define = yes;
    LOWB: start = $02A7, size = $59,   define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    LOADADDR: load = LA,   type = ro;
    STUB:     load = LOAD, type = ro;
    CODE:     load = LOAD, run = KRAM, type = ro, define = yes;
    RODATA:   load = LOAD, run = KRAM, type = ro, define = yes;
    DATA:     load = LOAD, run = KRAM, type = rw, define = yes;
    JUMPTAB:  load = LOAD, run = JT,   type = ro, define = yes;
    # the serial line (tty.s): small code that must be visible with the ROM
    # in, in the rest of the jump table's page (copied up with it), and the
    # hooks, copied down by tty_boot
    JTCODE:   load = LOAD, run = JT,   type = ro, define = yes;
    LOWCODE:  load = LOAD, run = LOWA, type = rw, define = yes;
    LOWDATA:  load = LOAD, run = LOWB, type = rw, define = yes;
    # code and data used only while booting: they run where they are loaded
    # (low in the pool) and are not copied up, so the pool gets the pages
    INIT:     load = LOAD, type = ro, define = yes;
    # swapping (swap.s): copied under the KERNAL ROM at boot
    HICODE:   load = LOAD, run = HI, type = ro, define = yes;
    HIBSS:    load = HI,   type = bss, define = yes;
    # the serial line's rings and state (tty.s), cleared by tty_init
    TTYBSS:   load = HI,   type = bss, define = yes;
    BSS:      load = KRAM, type = bss, define = yes;
}
