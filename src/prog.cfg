# Breadbin programs: linked at %S ($0000 and $0100) and turned into CX files
MEMORY {
    ZP: start = $23, size = $0D, type = rw;
    M:  start = %S,  size = $9000, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, optional = yes;
    CODE:     load = M, type = ro;
    RODATA:   load = M, type = ro, optional = yes;
    DATA:     load = M, type = rw, optional = yes;
    BSS:      load = M, type = bss, define = yes, optional = yes;
}
